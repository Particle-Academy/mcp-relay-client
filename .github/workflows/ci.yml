name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Third-party dependency allowlist. Cheap, and failing here is cheap --
      # the same check gates the release, so a PR that adds an unapproved or
      # abandoned dependency finds out now rather than at tag time.
      # The allowlist is FETCHED, never vendored: one source, no copies to drift.
      - name: Fetch the third-party allowlist
        uses: actions/checkout@v4
        with:
          repository: Particle-Academy/.github
          path: .third-party-allowlist
          persist-credentials: false

      - name: Third-party dependency allowlist
        run: node .third-party-allowlist/third-party/check.mjs --repo .
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Python and Go are installed because this repo ships single-file clients
      # in FOUR languages and CI previously ran none of them: connect.go was
      # never compiled, connect.py never imported, connect.sh never executed.
      # They diverged from src/ in nine ways as a direct result. The conformance
      # step below runs all four against one fixture table — which needs the
      # runtimes present, or it skips them and reports the skip as a failure.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      # Standalone CI has no pnpm workspace, so rewrite any `workspace:*` deps to
      # a plain range before install. A no-op when there are none.
      - name: Rewrite workspace protocol
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));for(const s of ['dependencies','devDependencies','peerDependencies','optionalDependencies']){if(!p[s])continue;for(const[n,v]of Object.entries(p[s])){if(typeof v==='string'&&v.startsWith('workspace:'))p[s][n]=v.slice('workspace:'.length)||'*';}}fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n');"

      - name: Install
        run: npm install --no-audit --no-fund --legacy-peer-deps

      - name: Lint
        run: npm run lint --if-present

      - name: Test
        run: npm test --if-present

      - name: Build
        run: npm run build --if-present

      # The shared conformance table, asserted by every single-file client.
      # `npm test` covers the TypeScript library's half.
      - name: Conformance — single-file clients
        run: node scripts/conformance-clients.mjs

      # go vet is not covered by the conformance run: that only proves the
      # program compiles enough to print endpoints, not that the rest of the
      # file is sound.
      - name: Vet connect.go
        run: go vet ./connect.go
